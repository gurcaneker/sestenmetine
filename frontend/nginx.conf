# Serves the built React SPA and reverse-proxies /api to the backend
# container. This is a Docker-Compose-network config (upstream "backend" is
# the compose service name/DNS entry) — NOT related to, and not sharing any
# domain/SSL config with, the separate LGS-platform project's Nginx setup.
# TLS/SSL termination is intentionally NOT handled here — this serves plain
# HTTP inside the Docker network; put a TLS-terminating reverse proxy (or a
# platform load balancer) in front of this container for production/public
# deployment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Must match (or exceed) backend's MAX_UPLOAD_SIZE (server.py, currently
    # 500 MB) — nginx's own default (1 MB) would otherwise reject large
    # audio/video uploads with 413 before they ever reach the backend.
    client_max_body_size 500M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Transcription of large/chunked files can take a while (frontend's
        # own axios call allows up to 30 min, Transcriber.jsx) — nginx's
        # default proxy timeouts (60s) would otherwise cut the request off
        # mid-transcription.
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # react-router-dom client-side routing: unknown paths fall back to
    # index.html so the SPA's own router handles them.
    location / {
        try_files $uri /index.html;
    }
}
