name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # emergentintegrations pins its own litellm wheel that conflicts with
      # requirements.txt's separate litellm line under one `pip install -r`
      # pass — same fix as backend/Dockerfile, see its comment for why.
      - name: Install dependencies
        run: |
          pip install emergentintegrations==0.2.0 \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          grep -viE '^emergentintegrations|^litellm' requirements.txt > requirements.rest.txt
          pip install -r requirements.rest.txt

      - name: Start server
        env:
          API_KEY: ci-test-key
          CORS_ORIGINS: http://localhost:3000
          # EMERGENT_LLM_KEY intentionally unset — TestTranscribeReal (the
          # only tests needing it) auto-skip without it, see backend_test.py.
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Run pytest
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
          API_KEY: ci-test-key
        run: pytest tests/backend_test.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: CI=true yarn test --watchAll=false
